<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2457">
  <meta name="description" content="SkyCast - live weather, hourly and 7-day forecast, air quality and UV for any city.">
  <title>SkyCast - Weather Information Fetcher</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>">
  <link rel="preconnect" href="https://geocoding-api.open-meteo.com" crossorigin>
  <link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
  <link rel="dns-prefetch" href="https://air-quality-api.open-meteo.com">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body class="t-clear-day">
  <canvas id="fx" aria-hidden="true"></canvas>
  <main class="app">
    <header class="brand">
      <div class="logo">☁️<span class="sun">☀️</span></div>
      <h1><span class="sky">SKY</span><span class="cast">CAST</span></h1>
      <p class="tagline">Get the latest weather information at your fingertips</p>
    </header>

    <form id="search-form" class="search" autocomplete="off">
      <input id="city" type="search" placeholder="Search city..." aria-label="City name" enterkeyhint="search" required role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest" autocapitalize="words" spellcheck="false">
      <button type="button" id="locate" class="icon-btn" title="Use my location" aria-label="Use my location">📍</button>
      <button type="submit" class="search-btn" aria-label="Search">🔍</button>
      <ul id="suggest" class="suggest hidden" role="listbox" aria-label="City suggestions"></ul>
    </form>

    <div id="recent" class="recent"></div>
    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section id="result" class="card hidden">
      <div class="top">
        <div class="loc"><span>📍</span> <strong id="location"></strong></div>
        <div class="actions">
          <button type="button" id="unit" class="pill" aria-label="Switch units">°C</button>
          <button type="button" id="refresh" class="pill" aria-label="Refresh">⟳</button>
          <button type="button" id="share" class="pill" aria-label="Share">⤴</button>
        </div>
      </div>

      <div class="current">
        <div id="icon" class="big-icon"></div>
        <div>
          <div class="temp"><span id="temp"></span><sup id="tu">°C</sup></div>
          <div id="desc" class="desc"></div>
          <div id="hl" class="hl"></div>
        </div>
      </div>
      <p id="tip" class="tip"></p>

      <div id="tiles" class="tiles"></div>

      <h2 class="sub">Next 24 Hours</h2>
      <div id="hourly" class="hourly"></div>

      <h2 class="sub">7-Day Forecast</h2>
      <div id="forecast" class="forecast"></div>
      <p class="updated">Last updated: <span id="updated"></span></p>
    </section>

    <footer class="site-footer">
      <div class="f-inst">🎓 SDMS · MITS Gwalior</div>
      <div class="f-rule"></div>
      <div class="f-row"><span class="f-label">Created by</span><span class="f-names"><b>Chirag Bansal</b> <i>&amp;</i> <b>Harshit Shekhar</b></span></div>
      <div class="f-row f-guide"><span class="f-label">Under the guidance of</span><span class="f-names"><b>Dr. Hemant Choubey Sir</b></span></div>
      <div class="f-meta">Data: Open-Meteo</div>
    </footer>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
